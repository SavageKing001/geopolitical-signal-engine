<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geopolitical Signal Bot</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --gold:       #C9A84C;
  --gold-dim:   #8a6f2e;
  --gold-bg:    rgba(201,168,76,0.08);
  --gold-border:rgba(201,168,76,0.28);
  --bg:         #080808;
  --bg-card:    #101010;
  --bg-card2:   #161616;
  --bg-hover:   #1a1a1a;
  --border:     #1e1e1e;
  --text:       #e6e4de;
  --text-dim:   #6a6760;
  --text-mid:   #9c9890;
  --up:         #4caf7d;
  --up-bg:      rgba(76,175,125,0.10);
  --up-border:  rgba(76,175,125,0.28);
  --down:       #e05a5a;
  --down-bg:    rgba(224,90,90,0.10);
  --down-border:rgba(224,90,90,0.28);
  --neutral:    #5a5a5a;
  --sidebar-w:  260px;
  --radius:     4px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;display:flex}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ── SIDEBAR ─────────────────────────────────────────────────────── */
#sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);height:100vh;
  background:var(--bg-card);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.sb-header{padding:24px 20px 18px;border-bottom:1px solid var(--gold-border)}
.sb-logo{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;
         color:var(--gold);letter-spacing:.14em;text-transform:uppercase}
.sb-sub{font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);
        margin-top:4px;letter-spacing:.08em}
.sb-section{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.16em;
            text-transform:uppercase;color:var(--text-dim);
            padding:14px 20px 8px;border-bottom:1px solid var(--border)}
#wl-sidebar{flex:1;overflow-y:auto;padding:4px 0}
.wl-row{display:flex;align-items:center;justify-content:space-between;
        padding:8px 16px;border-left:2px solid transparent;
        cursor:pointer;transition:all .15s;gap:8px}
.wl-row:hover{background:var(--bg-hover);border-left-color:var(--gold-dim)}
.wl-info{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.wl-name{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl-ticker{font-family:'DM Mono',monospace;font-size:10px;color:var(--gold)}
.wl-x{background:none;border:none;color:var(--text-dim);cursor:pointer;
      font-size:13px;padding:2px 5px;border-radius:3px;transition:color .15s,background .15s;line-height:1}
.wl-x:hover{color:var(--down);background:var(--down-bg)}
.wl-empty{padding:16px 20px;color:var(--text-dim);font-size:12px;font-style:italic}
.sb-nav{padding:14px 20px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.nav-a{font-family:'DM Mono',monospace;font-size:11px;color:var(--text-dim);
       text-decoration:none;letter-spacing:.05em;transition:color .15s}
.nav-a:hover{color:var(--gold)}

/* ── MAIN ────────────────────────────────────────────────────────── */
#main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0}
#topbar{height:52px;min-height:52px;background:var(--bg-card);border-bottom:1px solid var(--border);
        display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.tb-title{font-family:'Playfair Display',serif;font-size:15px;font-weight:600;
          color:var(--text);letter-spacing:.06em}
.tb-right{display:flex;align-items:center;gap:12px}
#clock{font-family:'DM Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:.08em}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--up);box-shadow:0 0 5px var(--up);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── CHAT ────────────────────────────────────────────────────────── */
#chat{flex:1;overflow-y:auto;padding:20px 24px 12px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:9px;max-width:840px}
.row.usr{align-self:flex-end;flex-direction:row-reverse;max-width:580px}
.avatar{font-family:'DM Mono',monospace;font-size:8px;color:var(--gold);
        background:var(--bg-card2);border:1px solid var(--gold-border);border-radius:3px;
        padding:4px 5px;height:fit-content;margin-top:2px;white-space:nowrap;letter-spacing:.08em}
.bubble{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
        padding:14px 16px;flex:1;min-width:0}
.row.usr .bubble{background:var(--bg-card2);border-color:var(--border);
                  font-size:13px;color:var(--text-mid)}

/* typing */
.dots{display:flex;align-items:center;gap:4px;padding:3px 0}
.dots span{width:6px;height:6px;background:var(--gold-dim);border-radius:50%;animation:bounce 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{font-family:'DM Mono',monospace;font-size:11px;color:var(--gold);
      background:var(--bg-card2);border:1px solid var(--gold-border);
      border-radius:20px;padding:5px 12px;cursor:pointer;transition:all .15s;letter-spacing:.03em}
.chip:hover{background:var(--gold-border);color:#fff}

/* ── INPUT ───────────────────────────────────────────────────────── */
#input-wrap{border-top:1px solid var(--gold-dim);padding:12px 24px;
            background:var(--bg-card);display:flex;gap:9px;align-items:center}
#input{flex:1;background:var(--bg-card2);border:1px solid var(--border);border-radius:var(--radius);
       color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;
       padding:10px 14px;outline:none;transition:border-color .2s}
#input::placeholder{color:var(--text-dim)}
#input:focus{border-color:var(--gold-dim)}
#send{background:var(--bg-card2);border:1px solid var(--gold-border);color:var(--gold);
      font-family:'DM Mono',monospace;font-size:15px;padding:9px 18px;
      border-radius:var(--radius);cursor:pointer;transition:all .15s}
#send:hover{background:var(--gold-border);color:#fff}

/* ── CARD UTILITIES ──────────────────────────────────────────────── */
.lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.16em;
     text-transform:uppercase;color:var(--gold-dim);margin-bottom:8px}
.msg-text{color:var(--text-mid);font-size:13px;line-height:1.55;margin-bottom:10px}
.divider{height:1px;background:var(--border);margin:14px 0}
.pill{display:inline-block;font-family:'DM Mono',monospace;font-size:10px;
      padding:3px 8px;border-radius:3px;letter-spacing:.04em}
.pill-sector {background:var(--gold-bg);  color:var(--gold); border:1px solid var(--gold-border)}
.pill-neutral{background:rgba(90,90,90,.1);color:var(--text-dim);border:1px solid var(--border)}
.pill-up     {background:var(--up-bg);    color:var(--up);   border:1px solid var(--up-border)}
.pill-down   {background:var(--down-bg);  color:var(--down); border:1px solid var(--down-border)}

/* ── COMPANY BRIEF — HEADER ─────────────────────────────────────── */
.co-name{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;
         color:var(--text);margin-bottom:3px;line-height:1.2}
.co-ticker{font-family:'DM Mono',monospace;font-size:13px;color:var(--gold);
           letter-spacing:.06em;margin-bottom:10px}
.co-meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.co-geo{font-style:italic;font-size:12px;color:var(--text-dim);line-height:1.5;
        border-left:2px solid var(--gold-border);padding-left:10px;margin-bottom:10px}

/* ── COMPANY BRIEF — PRICE ──────────────────────────────────────── */
.price-main{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.price-val{font-family:'DM Mono',monospace;font-size:26px;color:var(--text);letter-spacing:-.01em}
.price-chg{font-family:'DM Mono',monospace;font-size:13px;font-weight:500}
.price-chg.up{color:var(--up)}.price-chg.down{color:var(--down)}.price-chg.flat{color:var(--text-dim)}
.price-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.pg-cell{background:var(--bg-card2);border:1px solid var(--border);border-radius:3px;padding:6px 8px}
.pg-label{font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);
          letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.pg-val{font-family:'DM Mono',monospace;font-size:12px;color:var(--text-mid)}
.price-footer{font-family:'DM Mono',monospace;font-size:10px;color:var(--text-dim);
              letter-spacing:.04em;display:flex;gap:16px;flex-wrap:wrap}
.price-unavail{font-style:italic;font-size:12px;color:var(--text-dim);padding:8px 0}

/* ── COMPANY BRIEF — SIGNAL ─────────────────────────────────────── */
.sig-big{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;
         letter-spacing:.08em;margin-bottom:6px}
.sig-big.UP    {color:var(--up)  }.sig-big.DOWN{color:var(--down)}.sig-big.NEUTRAL{color:var(--neutral)}
.sig-meta{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.conf-badge{font-family:'DM Mono',monospace;font-size:10px;padding:3px 8px;
            border-radius:3px;border:1px solid var(--border);color:var(--text-dim)}
.sig-reason{font-style:italic;font-size:12px;color:var(--text-mid);
            line-height:1.6;margin-bottom:10px}
.event-pills{display:flex;flex-wrap:wrap;gap:5px}

/* ── COMPANY BRIEF — SENTIMENT ──────────────────────────────────── */
.sent-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.sent-cell{background:var(--bg-card2);border:1px solid var(--border);
           border-radius:3px;padding:8px 10px;text-align:center}
.sent-val{font-family:'DM Mono',monospace;font-size:18px;color:var(--gold);font-weight:500}
.sent-label{font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);
            letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.sent-mood{font-family:'DM Mono',monospace;font-size:10px;padding:3px 10px;
           border-radius:3px;display:inline-block;letter-spacing:.06em}
.sent-mood.positive{background:var(--up-bg);  color:var(--up);  border:1px solid var(--up-border)}
.sent-mood.negative{background:var(--down-bg);color:var(--down);border:1px solid var(--down-border)}
.sent-mood.neutral {background:rgba(90,90,90,.1);color:var(--text-dim);border:1px solid var(--border)}

/* ── COMPANY BRIEF — NEWS ───────────────────────────────────────── */
.news-list{display:flex;flex-direction:column;gap:1px}
.news-item{padding:9px 10px;border-radius:var(--radius);transition:background .15s}
.news-item:nth-child(even){background:var(--bg-card2)}
.news-item:hover{background:var(--bg-hover)}
.news-title a{font-size:13px;color:var(--text);text-decoration:none;line-height:1.4;
              display:block;transition:color .15s}
.news-title a:hover{color:var(--gold)}
.news-meta{font-family:'DM Mono',monospace;font-size:10px;color:var(--text-dim);margin-top:3px}
.no-news{font-style:italic;font-size:12px;color:var(--text-dim);padding:8px 0}

/* ── COMPANY BRIEF — EARNINGS ───────────────────────────────────── */
.earn-table{width:100%;border-collapse:collapse;font-size:12px}
.earn-table th{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;
               text-transform:uppercase;color:var(--text-dim);text-align:left;
               padding:5px 8px;border-bottom:1px solid var(--border)}
.earn-table td{padding:7px 8px;border-bottom:1px solid rgba(30,30,30,.7);font-family:'DM Mono',monospace;font-size:11px}
.earn-table tr:hover td{background:var(--bg-hover)}
.beat{color:var(--up)}.miss{color:var(--down)}.in-line{color:var(--text-dim)}

/* ── COMPANY BRIEF — ACTIONS ────────────────────────────────────── */
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{font-family:'DM Mono',monospace;font-size:11px;padding:7px 14px;border-radius:3px;
     cursor:pointer;border:1px solid var(--gold-border);background:transparent;
     color:var(--gold);letter-spacing:.05em;transition:all .15s}
.btn:hover{background:var(--gold-border);color:#fff}
.btn.added{opacity:.5;cursor:default;pointer-events:none;border-color:var(--border);color:var(--text-dim)}
.btn.secondary{border-color:var(--border);color:var(--text-dim)}
.btn.secondary:hover{background:var(--bg-hover);color:var(--text);border-color:var(--text-dim)}

/* ── WATCHLIST CARD ──────────────────────────────────────────────── */
.wl-table{width:100%;border-collapse:collapse;font-size:12px}
.wl-table th{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;
             text-transform:uppercase;color:var(--text-dim);text-align:left;
             padding:5px 8px;border-bottom:1px solid var(--border)}
.wl-table td{padding:8px 8px;border-bottom:1px solid rgba(30,30,30,.7)}
.wl-table tr{cursor:pointer}.wl-table tr:hover td{background:var(--bg-hover)}
.wl-t{font-family:'DM Mono',monospace;color:var(--gold);font-size:11px}
.wl-rm{background:none;border:none;color:var(--text-dim);cursor:pointer;
       font-size:12px;padding:2px 6px;border-radius:3px;transition:all .15s}
.wl-rm:hover{color:var(--down);background:var(--down-bg)}

/* ── CONFIRMATION ────────────────────────────────────────────────── */
.conf-icon{font-size:26px;margin-bottom:6px}
.conf-title{font-family:'Playfair Display',serif;font-size:15px;color:var(--text);margin-bottom:4px}
.conf-body{font-size:12px;color:var(--text-dim)}

/* ── WELCOME ─────────────────────────────────────────────────────── */
.welcome-h{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;
           color:var(--text);margin-bottom:4px}
.welcome-sub{font-size:13px;color:var(--text-mid);line-height:1.55;margin-bottom:14px}

/* ── HELP ────────────────────────────────────────────────────────── */
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.help-item{font-size:12px;color:var(--text-mid);background:var(--bg-card2);
           border:1px solid var(--border);border-radius:3px;padding:9px 11px;
           cursor:pointer;transition:border-color .15s,color .15s;line-height:1.4}
.help-item:hover{border-color:var(--gold-dim);color:var(--text)}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="sb-header">
    <div class="sb-logo">Signal Bot</div>
    <div class="sb-sub">Single-company intelligence · v3</div>
  </div>
  <div class="sb-section">Watchlist</div>
  <div id="wl-sidebar"><div class="wl-empty">Loading…</div></div>
  <div class="sb-nav">
    <a class="nav-a" href="http://localhost:5000" target="_blank">→ Main Dashboard</a>
    <a class="nav-a" href="http://localhost:5001/vaibhav" target="_blank">→ Command Center</a>
  </div>
</div>

<!-- MAIN -->
<div id="main">
  <div id="topbar">
    <span class="tb-title">Geopolitical Signal Bot</span>
    <div class="tb-right">
      <div class="live-dot"></div>
      <span id="clock">--:--:--</span>
    </div>
  </div>
  <div id="chat"></div>
  <div id="input-wrap">
    <input id="input" type="text"
      placeholder="Type a company name or ticker — e.g. GRSE.NS, Mazagon Dock, HAL…"
      autocomplete="off">
    <button id="send">→</button>
  </div>
</div>

<script>
// ── CLOCK ──────────────────────────────────────────────────────────
(function clock(){
  const el = document.getElementById('clock');
  setInterval(()=>{
    el.textContent = new Date().toLocaleTimeString('en-US',
      {hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
  },1000);
})();

// ── REFS ───────────────────────────────────────────────────────────
const chatEl = document.getElementById('chat');
const input  = document.getElementById('input');
const sendBtn= document.getElementById('send');

function scrollBottom(){ chatEl.scrollTop = chatEl.scrollHeight; }

function timeGreeting(){
  const h = new Date().getHours();
  return h<12?'Good morning':h<17?'Good afternoon':'Good evening';
}

// ── UTILS ──────────────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s){ return String(s||'').replace(/'/g,"\\'"); }

function fmtNum(n){
  if(n==null) return '—';
  n = parseFloat(n);
  if(isNaN(n)) return '—';
  if(Math.abs(n)>=1e12) return (n/1e12).toFixed(2)+'T';
  if(Math.abs(n)>=1e9)  return (n/1e9).toFixed(2)+'B';
  if(Math.abs(n)>=1e6)  return (n/1e6).toFixed(2)+'M';
  if(Math.abs(n)>=1e3)  return (n/1e3).toFixed(1)+'K';
  return n.toFixed(2);
}

function currSym(code){
  return {INR:'₹',USD:'$',AUD:'A$',GBP:'£',CAD:'C$',SEK:'kr',NOK:'kr',HKD:'HK$'}[code]||code||'';
}

function fmtPrice(val,curr){
  if(val==null) return '—';
  return currSym(curr)+parseFloat(val).toFixed(2);
}

function fmtVol(v){
  if(v==null) return '—';
  v=parseFloat(v);
  if(v>=1e9) return (v/1e9).toFixed(1)+'B';
  if(v>=1e6) return (v/1e6).toFixed(1)+'M';
  if(v>=1e3) return (v/1e3).toFixed(0)+'K';
  return v.toLocaleString();
}

// ── SIDEBAR WATCHLIST ──────────────────────────────────────────────
async function loadSidebar(){
  try{
    const wl = await fetch('/watchlist').then(r=>r.json());
    renderSidebar(wl);
  }catch(e){ document.getElementById('wl-sidebar').innerHTML='<div class="wl-empty">Error loading.</div>'; }
}

function renderSidebar(wl){
  const el = document.getElementById('wl-sidebar');
  if(!wl.length){ el.innerHTML='<div class="wl-empty">No companies tracked yet.</div>'; return; }
  el.innerHTML = wl.map(c=>`
    <div class="wl-row" onclick="sendMsg('${escAttr(c.ticker)}')" id="sbr-${c.ticker.replace(/\./g,'_')}">
      <div class="wl-info">
        <div class="wl-name">${esc(c.name)}</div>
        <div class="wl-ticker">${esc(c.ticker)}</div>
      </div>
      <button class="wl-x" onclick="event.stopPropagation();removeSidebar('${escAttr(c.ticker)}')" title="Remove">×</button>
    </div>`).join('');
}

async function removeSidebar(ticker){
  await fetch('/watchlist/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticker})});
  loadSidebar();
  appendBot({type:'confirmation',message:`Removed ${ticker} from watchlist.`,
             data:{action:'removed',company:{name:ticker,ticker}}});
}

// ── APPEND MESSAGES ────────────────────────────────────────────────
function appendUser(text){
  const r = document.createElement('div');
  r.className='row usr';
  r.innerHTML=`<div class="avatar">YOU</div><div class="bubble">${esc(text)}</div>`;
  chatEl.appendChild(r);
  scrollBottom();
}

function showTyping(){
  const r = document.createElement('div');
  r.className='row'; r.id='typing';
  r.innerHTML=`<div class="avatar">GSE</div>
    <div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div>`;
  chatEl.appendChild(r); scrollBottom(); return r;
}
function hideTyping(){ const el=document.getElementById('typing'); if(el) el.remove(); }

function appendBot(resp, chips){
  const r = document.createElement('div');
  r.className='row';
  r.innerHTML=`<div class="avatar">GSE</div><div class="bubble">${renderCard(resp)}</div>`;
  chatEl.appendChild(r);
  if(chips&&chips.length){
    const cr = document.createElement('div');
    cr.className='row';
    cr.innerHTML=`<div class="avatar" style="opacity:0;pointer-events:none">GSE</div>
      <div class="chips">${chips.map(c=>`<button class="chip" onclick="useChip(this,'${escAttr(c)}')">${esc(c)}</button>`).join('')}</div>`;
    chatEl.appendChild(cr);
  }
  scrollBottom();
}

function useChip(btn,text){
  btn.closest('.row').remove();
  sendMsg(text);
}

// ── CARD ROUTER ────────────────────────────────────────────────────
function renderCard(resp){
  const {type,message,data} = resp;
  if(type==='welcome')       return renderWelcome();
  if(type==='company_brief') return renderBrief(data);
  if(type==='watchlist_card')return renderWatchlistCard(data);
  if(type==='confirmation')  return renderConfirmation(message,data);
  if(type==='help')          return renderHelp(message);
  if(type==='error')         return renderError(message);
  return `<div class="msg-text">${esc(message||'')}</div>`;
}

// ── ERROR ───────────────────────────────────────────────────────────
function renderError(msg){
  return `<div style="color:var(--down);font-family:'DM Mono',monospace;font-size:11px;padding:4px 0">
    ⚠ ${esc(msg||'Unknown error')}
  </div>
  <div style="font-size:11px;color:var(--text-dim);margin-top:6px">
    Check the terminal for the full traceback.
  </div>`;
}

// ── WELCOME ────────────────────────────────────────────────────────
function renderWelcome(){
  return `
    <div class="welcome-h">${esc(timeGreeting())}, Vaibhav.</div>
    <div class="welcome-sub">
      Type any company name or ticker symbol — I'll pull live price data,
      recent news, and a geopolitical signal brief specific to that company.
    </div>`;
}

// ── COMPANY BRIEF ──────────────────────────────────────────────────
function renderBrief(d){
  const c   = d.company || {};
  const p   = d.price;
  const geo = d.geo_impact;
  const s   = d.sentiment || {};
  const out = [];

  // ── Section 1: Header
  out.push(`<div class="lbl">Company Profile</div>`);
  out.push(`<div class="co-name">${esc(d.name)}</div>`);
  out.push(`<div class="co-ticker">${esc(d.ticker)}</div>`);
  if(d.in_database){
    out.push(`<div class="co-meta">
      ${c.sector?`<span class="pill pill-sector">${esc(c.sector)}</span>`:''}
      ${c.headquarters_country?`<span class="pill pill-neutral">${esc(c.headquarters_country)}</span>`:''}
      ${c.market_cap_category?`<span class="pill pill-neutral">${esc(c.market_cap_category)} cap</span>`:''}
    </div>`);
    if(c.geopolitical_sensitivity)
      out.push(`<div class="co-geo">${esc(c.geopolitical_sensitivity)}</div>`);
  }

  // ── Section 2: Price
  out.push(`<div class="divider"></div>`);
  out.push(`<div class="lbl">Live Price Data</div>`);
  if(p){
    const sym    = currSym(p.currency||'');
    const chgCls = p.change_percent>0?'up':p.change_percent<0?'down':'flat';
    const chgPfx = p.change_percent>0?'+':'';
    out.push(`
      <div class="price-main">
        <span class="price-val">${sym}${p.current_price!=null?parseFloat(p.current_price).toFixed(2):'—'}</span>
        <span class="price-chg ${chgCls}">${chgPfx}${p.change_percent!=null?parseFloat(p.change_percent).toFixed(2):'—'}%</span>
      </div>
      <div class="price-grid">
        <div class="pg-cell"><div class="pg-label">Day High</div><div class="pg-val">${sym}${p.day_high!=null?parseFloat(p.day_high).toFixed(2):'—'}</div></div>
        <div class="pg-cell"><div class="pg-label">Day Low</div><div class="pg-val">${sym}${p.day_low!=null?parseFloat(p.day_low).toFixed(2):'—'}</div></div>
        <div class="pg-cell"><div class="pg-label">52W High</div><div class="pg-val">${sym}${p.week_52_high!=null?parseFloat(p.week_52_high).toFixed(2):'—'}</div></div>
        <div class="pg-cell"><div class="pg-label">52W Low</div><div class="pg-val">${sym}${p.week_52_low!=null?parseFloat(p.week_52_low).toFixed(2):'—'}</div></div>
      </div>
      <div class="price-footer">
        <span>Vol: ${fmtVol(p.volume)}</span>
        <span>Mkt Cap: ${sym}${fmtNum(p.market_cap)}</span>
        ${p.pe_ratio!=null?`<span>P/E: ${parseFloat(p.pe_ratio).toFixed(2)}</span>`:''}
        <span style="color:var(--text-dim);margin-left:auto">via Yahoo Finance</span>
      </div>`);
  } else {
    out.push(`<div class="price-unavail">Price data unavailable for this ticker.</div>`);
  }

  // ── Section 3: Geopolitical Signal
  if(geo){
    out.push(`<div class="divider"></div>`);
    out.push(`<div class="lbl">Geopolitical Signal</div>`);
    out.push(`<div class="sig-big ${esc(geo.signal)}">${esc(geo.signal)}</div>`);
    out.push(`<div class="sig-meta">
      <span class="conf-badge">${esc(geo.confidence)} confidence</span>
      <span class="pill pill-neutral">${esc(geo.driver)}</span>
      ${geo.primary_event?`<span class="pill pill-neutral">${esc(geo.primary_event)}</span>`:''}
    </div>`);
    out.push(`<div class="sig-reason">${esc(geo.reasoning)}</div>`);
    if(geo.active_events&&geo.active_events.length){
      out.push(`<div class="event-pills">${geo.active_events.map(e=>`<span class="pill pill-neutral">${esc(e)}</span>`).join('')}</div>`);
    }
  }

  // ── Section 4: News Sentiment
  out.push(`<div class="divider"></div>`);
  out.push(`<div class="lbl">News Sentiment</div>`);
  out.push(`<div class="sent-grid">
    <div class="sent-cell"><div class="sent-val">${s.panic||0}</div><div class="sent-label">Panic</div></div>
    <div class="sent-cell"><div class="sent-val">${s.boycott||0}</div><div class="sent-label">Boycott</div></div>
    <div class="sent-cell"><div class="sent-val">${s.trust_collapse||0}</div><div class="sent-label">Trust Collapse</div></div>
  </div>`);
  const mood = (s.overall_sentiment||'neutral').toLowerCase();
  out.push(`<span class="sent-mood ${esc(mood)}">${esc(mood.toUpperCase())}</span>`);

  // ── Section 5: News
  out.push(`<div class="divider"></div>`);
  out.push(`<div class="lbl">Latest News</div>`);
  const news = d.news||[];
  if(news.length){
    out.push(`<div class="news-list">`);
    news.slice(0,6).forEach(a=>{
      const url = a.url||'#';
      out.push(`<div class="news-item">
        <div class="news-title"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(a.title||'Untitled')}</a></div>
        <div class="news-meta">${esc(a.source||'')}${a.date?' · '+esc(a.date):''}</div>
      </div>`);
    });
    out.push(`</div>`);
  } else {
    out.push(`<div class="no-news">No recent news articles found for this company.</div>`);
  }

  // ── Section 6: Earnings
  const earnings = d.earnings||[];
  if(earnings.length){
    out.push(`<div class="divider"></div>`);
    out.push(`<div class="lbl">Recent Earnings (EPS)</div>`);
    out.push(`<div style="overflow-x:auto"><table class="earn-table">
      <thead><tr><th>Quarter</th><th>Actual EPS</th><th>Estimated EPS</th><th>Surprise</th></tr></thead><tbody>`);
    earnings.forEach(e=>{
      const beat   = (e.actual_eps||0) >= (e.estimated_eps||0);
      const sp     = e.surprise_pct||0;
      const spCls  = sp>0?'beat':sp<0?'miss':'in-line';
      const spPfx  = sp>0?'+':'';
      out.push(`<tr>
        <td>${esc(e.date||'—')}</td>
        <td>${e.actual_eps!=null?e.actual_eps:'—'}</td>
        <td>${e.estimated_eps!=null?e.estimated_eps:'—'}</td>
        <td class="${spCls}">${spPfx}${sp}%</td>
      </tr>`);
    });
    out.push(`</tbody></table></div>`);
  }

  // ── Section 7: Actions
  out.push(`<div class="divider"></div>`);
  out.push(`<div class="actions">`);
  if(d.in_database){
    const inWL = d.in_watchlist;
    out.push(`<button class="btn${inWL?' added':''}" id="wl-btn-${esc(d.ticker.replace(/\./g,'_'))}"
      onclick="${inWL?'':` addToWL(this,'${escAttr(d.ticker)}')`}">
      ${inWL?'★ In watchlist':'+ Add to watchlist'}
    </button>`);
  }
  out.push(`<button class="btn secondary" onclick="clearInput()">Ask about another →</button>`);
  out.push(`</div>`);

  return out.join('');
}

async function addToWL(btn, ticker){
  btn.textContent='…'; btn.disabled=true;
  try{
    const r = await fetch('/watchlist/add',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({ticker})});
    const d = await r.json();
    btn.textContent='★ In watchlist';
    btn.classList.add('added');
    loadSidebar();
  }catch(e){ btn.textContent='Error'; btn.disabled=false; }
}

// ── WATCHLIST CARD ─────────────────────────────────────────────────
function renderWatchlistCard(d){
  const wl = d.watchlist||[];
  if(!wl.length) return `<div class="lbl">Your Watchlist</div>
    <div class="no-news">No companies tracked. Try: "add GRSE.NS to watchlist"</div>`;
  const rows = wl.map(c=>`<tr onclick="sendMsg('${escAttr(c.ticker)}')" title="Look up ${esc(c.name)}">
    <td>${esc(c.name)}</td>
    <td class="wl-t">${esc(c.ticker)}</td>
    <td style="color:var(--text-dim);font-size:11px">${esc(c.sector||'')}</td>
    <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text-dim)">${c.buy_price||'—'}</td>
    <td><button class="wl-rm" onclick="event.stopPropagation();sendMsg('remove ${escAttr(c.ticker)}')">×</button></td>
  </tr>`).join('');
  return `<div class="lbl">Your Watchlist — ${wl.length} ${wl.length===1?'company':'companies'}</div>
    <div style="overflow-x:auto"><table class="wl-table">
      <thead><tr><th>Company</th><th>Ticker</th><th>Sector</th><th>Buy Price</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div style="margin-top:10px;font-family:'DM Mono',monospace;font-size:10px;color:var(--text-dim)">
      Click any row to look up that company.</div>`;
}

// ── CONFIRMATION ───────────────────────────────────────────────────
function renderConfirmation(msg, d){
  const action = d.action||'';
  const icon   = action==='removed'?'✕':action==='already_exists'?'◈':'✓';
  const color  = action==='removed'?'var(--down)':action==='already_exists'?'var(--gold-dim)':'var(--gold)';
  return `<div class="conf-icon" style="color:${color}">${icon}</div>
    <div class="conf-title">${esc(d.company?d.company.name:'')||esc(msg)}</div>
    <div class="conf-body">${esc(msg)}</div>`;
}

// ── HELP ───────────────────────────────────────────────────────────
function renderHelp(msg){
  const examples=[
    'GRSE.NS','Mazagon Dock Shipbuilders',
    'HAL.NS','Bharat Electronics',
    'Show my watchlist','Add MAZDOCK.NS to watchlist',
    'Remove GRSE.NS','Kosmos Energy',
  ];
  return `<div class="lbl">How can I help?</div>
    <div class="msg-text">${esc(msg||'Try one of these, or type any company name or ticker:')}</div>
    <div class="help-grid">${examples.map(e=>`<div class="help-item" onclick="sendMsg('${escAttr(e)}')">${esc(e)}</div>`).join('')}</div>`;
}

// ── SEND ───────────────────────────────────────────────────────────
async function sendMsg(text){
  text = (text||'').trim();
  if(!text) return;
  input.value='';
  appendUser(text);
  showTyping();

  let res, rawText, data;
  try {
    res = await fetch('/chat', {
      method:  'POST',
      headers: {'Content-Type': 'application/json'},
      body:    JSON.stringify({message: text}),
    });
  } catch(netErr) {
    console.error('[CHAT] Network error:', netErr);
    hideTyping();
    appendBot({type:'error', message:`Network error: ${netErr.message} — is the server running on port 5002?`, data:{}});
    return;
  }

  try {
    rawText = await res.text();
  } catch(readErr) {
    console.error('[CHAT] Could not read response body:', readErr);
    hideTyping();
    appendBot({type:'error', message:'Could not read server response.', data:{}});
    return;
  }

  console.log(`[CHAT] HTTP ${res.status} — raw (first 500 chars):`, rawText.slice(0, 500));

  try {
    data = JSON.parse(rawText);
  } catch(parseErr) {
    console.error('[CHAT] JSON parse failed:', parseErr, '\nFull response:', rawText);
    hideTyping();
    appendBot({type:'error',
      message:`Server returned non-JSON (HTTP ${res.status}). Check the terminal for the traceback.`,
      data:{}});
    return;
  }

  console.log('[CHAT] Parsed response:', data);
  hideTyping();

  let chips = [];
  if(data.type==='welcome'){
    chips=['GRSE.NS','Mazagon Dock','Bharat Electronics','Show my watchlist'];
  } else if(data.type==='company_brief' && data.data){
    const d = data.data;
    if(!d.in_watchlist && d.in_database) chips.push(`Add ${d.ticker} to watchlist`);
  } else if(data.type==='confirmation'){
    if((data.data||{}).action==='added') chips=['Show my watchlist'];
  }

  appendBot(data, chips);

  if(data.type==='confirmation'){
    const act = (data.data||{}).action;
    if(act==='added' || act==='removed') loadSidebar();
  }
}

function clearInput(){
  input.value='';
  input.focus();
}

// ── EVENT LISTENERS ────────────────────────────────────────────────
sendBtn.addEventListener('click',()=>{ const t=input.value.trim(); if(t) sendMsg(t); });
input.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const t=input.value.trim(); if(t) sendMsg(t); }});

// ── INIT ───────────────────────────────────────────────────────────
(async function init(){
  await loadSidebar();
  appendBot(
    {type:'welcome',message:'',data:{}},
    ['GRSE.NS','Mazagon Dock','Bharat Electronics','Show my watchlist']
  );
})();
</script>
